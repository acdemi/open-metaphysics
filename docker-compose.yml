# OpenMetaphysics -- Infrastructure Services
# Usage:
#   docker compose up -d               # Start core services (PG, Qdrant, Valkey)
#   docker compose --profile app up -d  # Also build/start the API service (port 8000)
#   docker compose --profile llm up -d  # Also start Ollama for local LLM
#   docker compose down                # Stop all services

services:
  postgres:
    image: apache/age:PG16
    container_name: om-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: om
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openmetaphysics
    ports:
      - "${OMP_POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U om -d openmetaphysics"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: om-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "${OMP_QDRANT_HTTP_BIND:-127.0.0.1}:6333:6333"
      - "${OMP_QDRANT_GRPC_BIND:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: om-valkey
    restart: unless-stopped
    ports:
      - "${OMP_VALKEY_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: om-app
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # persistence: PostgreSQL store (Valkey remains reserved, no consumer yet)
      OM_POSTGRES_DSN: "postgresql+psycopg://om:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/openmetaphysics"
      # RAG/explain stay offline by default; enabling requires the llm profile + Ollama
      OM_RAG_ENABLED: "false"
      OM_ENABLE_EXPLAINER: "false"
    ports:
      - "${OMP_API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: om-ollama
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "${OMP_OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  qdrant_data:
  valkey_data:
  ollama_data:

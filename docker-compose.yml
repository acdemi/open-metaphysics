# OpenMetaphysics -- Infrastructure Services
# Usage:
#   docker compose up -d              # Start core services (PG, Qdrant, Valkey)
#   docker compose --profile llm up -d # Also start Ollama for local LLM
#   docker compose down               # Stop all services

services:
  postgres:
    image: apache/age:PG16
    container_name: om-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: om
      POSTGRES_PASSWORD: om_dev
      POSTGRES_DB: openmetaphysics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U om -d openmetaphysics"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: om-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: om-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: om-ollama
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  qdrant_data:
  valkey_data:
  ollama_data:

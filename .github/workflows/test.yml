name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      # PR gate stays fast: heavy wheel-install / docker smoke tests are marked
      # `slow` and run in the nightly workflow (with logs preserved on failure).
      - run: uv run pytest -q -m "not slow"
      - name: Conformance Suite (contract-conformant; partial/skipped are NOT passes)
        run: |
          uv run python -c "
          from reference.conformance import CheckStatus
          from reference.conformance_runner import ConformanceRunner, ReferenceAdapter
          r = ConformanceRunner().run(ReferenceAdapter(), 'reference', '1.0.0')
          assert r.failed == 0, f'Conformance failed: {r.failed} checks failed'
          assert r.contract_conformant, f'not contract-conformant: behavior_coverage={r.behavior_coverage}'
          assert r.passed + r.failed + r.partial + r.skipped == r.total, 'status counters do not add up'
          assert r.coverage == r.passed / r.total, 'coverage must be passed/total'
          assert all(c.passed == (c.status == CheckStatus.PASSED) for c in r.checks), 'passed flag contradicts status'
          if r.partial or r.skipped:
              assert r.certified is False, 'certified requires 100% full pass; partial/skipped must not be counted as passed'
          print(f'Conformance OK: total={r.total} passed={r.passed} partial={r.partial} skipped={r.skipped} failed={r.failed} certified={r.certified} contract_conformant={r.contract_conformant}')
          "

  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd services/gateway && go test ./...

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - name: Conformance Suite
        run: |
          uv run python -c "from reference.conformance_runner import ConformanceRunner, ReferenceAdapter; r = ConformanceRunner().run(ReferenceAdapter(), 'reference', '1.0.0'); assert r.certified, f'Conformance failed: {r.failed} checks failed'"

  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd services/gateway && go test ./...

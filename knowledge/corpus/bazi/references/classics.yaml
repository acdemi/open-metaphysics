    passage: 以甲为例见甲：为比肩、兄弟。见乙：为劫财、败财，剋父及妻。见丙：为食神、天厨、寿星，为男。见丁：为伤官、退财、耗气，子甥。见戊：为偏财、偏妻、偏妾，剋子。见己：为正财、正妻，剋母，为合神。见庚：为偏官、七杀、官鬼、将星。见辛：为正官、禄马、荣神，父母。见壬：为倒食、偏印、梟神，剋女。见癸：为印綬、正人、君子，产业。（逐字核验章节；与 docs/bazi/BAZI_BEHAVIOR_CONTRACT.md BC-006 十神映射一致。）

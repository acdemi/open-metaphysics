    node_type: wuxing
    name_cn: 金
    name_en: bazi_metal
    systems: [bazi]
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    interpretation: 五行之金，主义，主肃杀收敛。于时为秋，于方为西。庚辛日主属金：庚为斧钺之金主刚断，辛为首饰之金主清秀。金得令则刚毅守规，失令遇火克则销铄易折。
    tags: [五行, 金, 肃杀]
    confidence: 0.9

    name_cn: 土
    name_en: bazi_earth
    systems: [bazi]
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    interpretation: 五行之土，主信，主承载稼穑。于时为四季之末（长夏），于方为中。戊己日主属土：戊为城墙堤岸之土主厚重，己为田园之土主包容。土得令则信实沉稳，失令遇木克则壅塞不通。
    tags: [五行, 土, 承载]
    confidence: 0.9

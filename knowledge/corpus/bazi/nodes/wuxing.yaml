    name_cn: 水
    name_en: bazi_water
    systems: [bazi]
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    interpretation: 五行之水，主智，主润下流通。于时为冬，于方为北。壬癸日主属水：壬为江河之水主奔涌，癸为雨露之水主润泽。水得令则机智流通，失令遇土克则滞塞多虑。
    tags: [五行, 水, 润下]
    confidence: 0.9
    attributes: { element: 水, season: 冬, direction: 北, stems: [壬, 癸] }
  - id: kn:wuxing:bazi_wangshuai
    node_type: wuxing
    name_cn: 旺衰
    name_en: bazi_wang_shuai
    systems: [bazi]
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    interpretation: 旺衰指五行在四时所处的旺、相、休、囚、死五种状态：当令者旺，令所生者相，生令者休，克令者囚，令所克者死。日主强弱以月令司权为首要依据，再参通根、透干与全局生扶克泄：得令得地得势者偏强，失令失地失势者偏弱。旺衰只是强弱判断的基础概念，具体取用另见用神。
    tags: [五行, 旺衰, 月令]
    confidence: 0.85
    attributes: { 状态: 旺相休囚死, 首要依据: 月令, 参考: [通根, 透干, 生扶, 克泄] }

    interpretation: 五行之木，主仁，主生发条达。于时为春，于方为东。甲乙日主属木：甲为参天之木主开拓，乙为花草藤蔓主柔韧。木得令则条理仁厚，失令受金克则郁滞少断。
    tags: [五行, 木, 生发]
    confidence: 0.9
    attributes: { element: 木, season: 春, direction: 东, stems: [甲, 乙] }

    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    interpretation: 五行之火，主礼，主炎上光明。于时为夏，于方为南。丙丁日主属火：丙为太阳之火主显达，丁为灯烛之火主精微。火得令则热诚文明，失令遇水克则燥郁无恒。
    tags: [五行, 火, 炎上]
    confidence: 0.9
    attributes: { element: 火, season: 夏, direction: 南, stems: [丙, 丁] }

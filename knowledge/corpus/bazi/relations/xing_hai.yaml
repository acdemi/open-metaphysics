# KnowledgeRelation — 地支刑（xing, 12 条）/ 地支六害（hai, 6 条）（BaZi Corpus）
# P2.1 BaZi Knowledge Integration:
#   刑: 无恩之刑 寅巳申（3）+ 恃势之刑 丑戌未（3）+ 无礼之刑 子卯互刑（2）
#       + 自刑 辰/午/酉/亥（4 自环）  = 12
#   六害: 子未 / 丑午 / 寅巳 / 卯辰 / 申亥 / 酉戌 = 6
#
# 证据（逐字核验章节, 与 Ziwei 冻结语料 relations/xing.yaml /
#   relations/sanming_xinghai.yaml 同源同据）:
#   渊海子平·论大运: 「忌寅刑巳、巳刑申、申刑寅」
#   渊海子平·论命细法: 「子卯相刑门户，全无礼德」
#   三命通会·卷二·论三刑: 恃势之刑 丑→戌→未→丑
#   三命通会·卷二·论六害: 六配对逐字出现
# 证据级别不齐说明: 自刑（辰午酉亥）本轮未取得章节级逐字原文 → 仅作书级
#   来源归属并记入 P2.1 报告「剩余证据缺口」（不引用未核验原文）。
# 规范: KR-001~003 / reference/knowledge.py::KnowledgeRelation
# ID 命名: 加 bazi_ 域前缀, 避免与 Ziwei 冻结语料 rel:xing:*/rel:hai:* 冲突。


# KnowledgeRelation — 地支三合（he, 8 条）/ 地支三会（he, 8 条）（BaZi Corpus）
# P2.1 BaZi Knowledge Integration:
#   三合局（san_he）: 申子辰合水 / 亥卯未合木 / 寅午戌合火 / 巳酉丑合金
#   三会方（san_hui）: 寅卯辰会东方木 / 巳午未会南方火 / 申酉戌会西方金 / 亥子丑会北方水
#
# 结构说明（冻结 KB-007 关系为二元有向边, 无法表达三元组）:
#   每局以「中神（帝旺/三合中位）」或「仲神（三会中位）」为 source, 另两支为
#   target, 各 2 条边; 整局的完整成员以 evidence.description + conditions 显式记载,
#   不静默合并为单一「局」节点（A8: 不扩 schema）。
# 证据级别: 书级来源归属（渊海子平, Tier 1, revision-pinned）;
#   逐局章节级逐字核验未在本轮完成 → 见 P2.1 报告「剩余证据缺口」。
# 注: 三合（四正 + 四生 + 四墓）、三会（四孟/四仲/四季）为方局概念, 与
#   六合/六冲/六害不同层级; 辰既是申子辰三合成员又是寅卯辰三会成员, 并存不冲突。
# 规范: KR-001~003 / reference/knowledge.py::KnowledgeRelation
# ID 命名: 加 bazi_ 域前缀, 避免与 Ziwei 冻结语料冲突。


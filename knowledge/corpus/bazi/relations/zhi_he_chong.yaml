  - id: rel:bazi_chong:mao_you
    source_node_id: kn:earthly_branch:bazi_mao
    target_node_id: kn:earthly_branch:bazi_you
    relation_type: chong
    direction: undirected
    weight: 1.0
    evidence:
      - { description: "卯酉相冲（六冲之一，木金之冲，四正之冲）", source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }, weight: 1.0 }
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    conditions:
      - { field: relation_subtype, value: liu_chong }
  - id: rel:bazi_chong:chen_xu
    source_node_id: kn:earthly_branch:bazi_chen
    target_node_id: kn:earthly_branch:bazi_xu
    relation_type: chong
    direction: undirected
    weight: 1.0
    evidence:
      - { description: "辰戌相冲（六冲之一，土土之冲，辰为水库、戌为火库）", source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }, weight: 1.0 }
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }
    conditions:
      - { field: relation_subtype, value: liu_chong }
  - id: rel:bazi_chong:si_hai
    source_node_id: kn:earthly_branch:bazi_si
    target_node_id: kn:earthly_branch:bazi_hai
    relation_type: chong
    direction: undirected
    weight: 1.0
    evidence:
      - { description: "巳亥相冲（六冲之一，火水之冲，四生之冲）", source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }, weight: 1.0 }
    source: { text: 渊海子平, author: 徐升, url: "https://zh.wikisource.org/wiki/渊海子平", credibility: 0.8 }

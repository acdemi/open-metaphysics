    node_type: palace
    name_cn: 八宫
    name_en: liuyao_eight_palaces
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 卦象圖第二, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 京房八宫，以八纯卦为宫首，每宫各领八卦，合为六十四卦。八宫为六爻装卦之纲：得卦先寻其所属之宫，以宫之五行为「我」，再按纳甲地支五行与宫五行之生克安六亲。八纯卦世在六爻，一世至五世依次在初至五爻，游魂卦世在四爻，归魂卦世在三爻。
    tags: [六爻, 八宫, 京房, 六十四卦, 装卦]

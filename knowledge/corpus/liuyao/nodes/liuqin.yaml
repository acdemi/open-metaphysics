    interpretation: 六亲之一，比和者为兄弟。占兄弟、姐妹、族中兄弟、姑姨、妹夫及结拜兄弟，以兄弟爻为用神。兄弟为同类之人，彼得志则欺凌，见财则夺，故占财物以此为劫神，占谋事以此为阻神，占妻妾婢仆以此为刑伤克害之神。五行上与宫相同。
    tags: [六爻, 六亲, 兄弟, 劫财, 阻隔, 比和]
    confidence: 0.9
    attributes: { role: 兄弟, relation: 同我, yong_shen_for: [兄弟, 朋友, 同事, 合伙], adverse_for: [财物, 谋事, 妻妾] }

  - id: kn:ten_god:liuyao_zisun
    node_type: ten_god
    name_cn: 子孙
    name_en: liuyao_children
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 用神章第八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 六亲之一，我生者为子孙。占子孙、女儿、女婿、侄甥、门生及在我子孙辈中者，以子孙爻为用神；占忠臣、良将、医药、僧道、兵卒、六畜禽兽，亦以子孙爻为用神。子孙为福德之神，为制鬼之神、解忧之神、剥官之神，诸事见之为喜，独占功名者忌之。五行上为宫所生者。
    tags: [六爻, 六亲, 子孙, 福德, 医药, 我生]
    confidence: 0.9
    attributes: { role: 子孙, relation: 我生, yong_shen_for: [子孙, 医药, 僧道, 六畜], adverse_for: [功名] }


nodes:
  - id: kn:ten_god:liuyao_liuqin
    node_type: ten_god
    name_cn: 六亲
    name_en: liuyao_six_relatives
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 六親歌章第五, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 六爻以卦宫五行为「我」，按各爻纳甲地支五行与「我」的生克关系安六亲：生我者为父母，我生者为子孙，克我者为官鬼，我克者为妻财，比和者为兄弟。乾兑宫属金，故金为兄弟、土为父母、木为妻财、火为官鬼、水为子孙；坎宫属水、坤艮宫属土、离宫属火、震巽宫属木，各依此类推。变卦之爻仍照正卦推六亲。
    tags: [六爻, 六亲, 父母, 兄弟, 子孙, 妻财, 官鬼]
    confidence: 0.9
    attributes: { relation_to_self: { 同我: 兄弟, 我生: 子孙, 生我: 父母, 我克: 妻财, 克我: 官鬼 } }

  - id: kn:ten_god:liuyao_fumu
    node_type: ten_god
    name_cn: 父母
    name_en: liuyao_parents
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 用神章第八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 六亲之一，生我者為父母。占父母、祖父母、伯叔姑姨、师长及与我父母同辈之亲，以父母爻为用神；占天地、城池、墙垣、宅舍、屋宇、舟车、衣服、雨具、章奏、文书、书馆文契，亦以父母爻为用神。一切庇护我身者属之。五行上为生宫者。
    tags: [六爻, 六亲, 父母, 文书, 房屋, 生我]
    confidence: 0.9
    attributes: { role: 父母, relation: 生我, yong_shen_for: [父母, 长辈, 文书, 房屋, 舟车] }

  - id: kn:ten_god:liuyao_xiongdi
    node_type: ten_god
    name_cn: 兄弟
    name_en: liuyao_siblings
    systems: [liuyao]

    interpretation: 旺相静爻被日辰冲为暗动，休囚静爻被日辰冲为日破。暗动有喜有忌：用神休囚得元神暗动相生为喜；忌神明动于卦中，得元神暗动而生用神亦为喜；用神休囚无助而忌神克害则为忌。暗动之应，祸福来时人不知不觉。
    tags: [六爻, 暗动, 日辰, 静爻, 旺相]
    confidence: 0.9
    attributes: { trigger: 日辰冲旺相静爻, opposite: 日破, polarity: 有喜有忌 }


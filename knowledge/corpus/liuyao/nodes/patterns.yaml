  - id: kn:pattern:liuyao_choushen
    node_type: pattern
    name_cn: 仇神
    name_en: liuyao_enemy_spirit
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 用神元神忌神仇神章第九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 仇神者，克元神而生忌神也。用神为所测之主，元神生用神，忌神克用神，仇神则克元神、生忌神，间接助忌伤用。六爻断法先定用神，再察元神、忌神、仇神之旺衰与动静。
    tags: [六爻, 仇神, 用神体系, 生克]
    confidence: 0.9
    attributes: { role: 仇神, controls: 元神, generates: 忌神 }

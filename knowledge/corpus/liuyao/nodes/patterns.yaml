    interpretation: 六合者，子与丑合、寅与亥合、卯与戌合、辰与酉合、巳与申合、午与未合。相合法有六：日月合爻、爻与爻合、爻动化合、卦逢六合、六冲卦变六合卦、六合卦变六合卦。诸合皆以用神旺者为吉；占讼狱不利，冤仇难解。
    tags: [六爻, 六合, 六合卦, 合起, 合绊, 化扶]
    confidence: 0.9
    attributes: { pairs: [[子, 丑], [寅, 亥], [卯, 戌], [辰, 酉], [巳, 申], [午, 未]], kinds: 6 }

  - id: kn:pattern:liuyao_sanhe_ju
    node_type: pattern
    name_cn: 三合局
    name_en: liuyao_three_harmony

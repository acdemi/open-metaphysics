    interpretation: 寅刑巳、巳刑申、子刑卯、卯刑午、丑戌相刑、未辰相刑；又云辰午酉亥谓之自刑。野鶴谓三刑独犯得验者少，多因用神休囚又兼他爻犯之则见凶，故三刑须兼用神旺衰而断，不可单执。

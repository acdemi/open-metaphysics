    interpretation: 六冲卦者，八纯卦（乾为天、坎为水、艮为山、震为雷、巽为风、离为火、坤为地、兑为泽）皆是，再加天雷无妄、雷天大壮，共十卦。冲者散也：占凶事宜于冲散，占吉事不宜；用神旺虽冲不破，用神失陷凶而又凶。六合卦变六冲者，先合后离、始荣终悴。
    tags: [六爻, 六冲, 六冲卦, 八纯卦, 冲散]
    confidence: 0.9
    attributes: { hexagrams: [乾为天, 坎为水, 艮为山, 震为雷, 巽为风, 离为火, 坤为地, 兑为泽, 天雷无妄, 雷天大壮], count: 10, meaning: 散 }

  - id: kn:pattern:liuyao_liuhe_gua

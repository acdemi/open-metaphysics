    interpretation: 旬空又名空亡：甲子旬中戌亥空，甲戌旬中申酉空，甲申旬中午未空，甲午旬中辰巳空，甲辰旬中寅卯空，甲寅旬中子丑空。旺不为空，动不为空，有日建动爻生扶者不为空；月破为空，真空为空。出旬则不空，填实之日、冲空之日皆可应事。

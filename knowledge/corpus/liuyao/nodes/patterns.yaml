    interpretation: 申子辰合成水局、巳酉丑合成金局、寅午戌合成火局、亥卯未合成木局。成局有四：一卦之内一爻动而合局、两爻动一爻不动亦成局、内卦初爻三爻动而变出爻成局、外卦四爻六爻动而变出之爻成局。占求谋喜庆宜成局，占官讼忧疑而合局者终身团结难消。
    tags: [六爻, 三合, 三合局, 水局, 金局, 火局, 木局]
    confidence: 0.9

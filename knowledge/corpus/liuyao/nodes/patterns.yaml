    confidence: 0.9
    attributes: { void_by_decade: { 甲子: [戌, 亥], 甲戌: [申, 酉], 甲申: [午, 未], 甲午: [辰, 巳], 甲辰: [寅, 卯], 甲寅: [子, 丑] }, non_void_when: [旺, 动, 日建生扶] }


    interpretation: 日辰冲动爻、或动爻冲爻，皆可谓之冲散。野鹤屡试：旺相者冲之不散，有气者冲之不散，休囚者偶有冲散，亦千百中之一二。神兆机于动，动必有因；今日受制，后逢值日则不散。

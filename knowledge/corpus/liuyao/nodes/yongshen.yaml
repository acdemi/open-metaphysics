    interpretation: 用神为一卦所测之事的核心爻。占父母以父母爻为用神，占功名官鬼、占财物妻财、占兄弟朋友兄弟、占子孙医药子孙；自占吉凶则以世爻为用神。用神既定，再察其旺衰、动静、空破，以及元神、忌神、仇神之生克。

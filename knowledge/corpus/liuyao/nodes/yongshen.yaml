  - id: kn:xi_shen:liuyao_yuanshen
    node_type: xi_shen
    name_cn: 元神
    name_en: liuyao_generating_spirit
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 用神元神忌神仇神章第九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 元神者，生用神之神也。元神虽生用神，须要旺相方可生得用神：旺相或临日月、日月动爻生扶、动化回头生及化进神、长生帝旺于日辰、与忌神同动、旺动临空化空，此五者为有力之元神，诸占皆吉。若休囚不动、自空月破、动化退神、衰而又绝、入三墓、化绝化克化破化散，则无力生用神。
    tags: [六爻, 元神, 生用神, 用神体系, 旺衰]
    confidence: 0.9
    attributes: { role: 元神, generates: 用神, gapped_node_type: xi_shen }

  - id: kn:ji_shen:liuyao_jishen
    node_type: ji_shen
    name_cn: 忌神
    name_en: liuyao_controlling_spirit
    systems: [liuyao]
    source: { text: 增刪卜易, chapter: 用神元神忌神仇神章第九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    interpretation: 忌神者，克用神之爻也。忌神动而克害用神者有五：旺相或遇日月动爻生扶或临日月、动化回头生扶退神、旺动临空化空、长生帝旺与日辰、与仇神同动，此五者诸占大凶。若休囚不动、静临空破、入三墓、衰动化退神、衰而又绝、动化绝化破化克化散、与元神同动，则无力克用神。
    tags: [六爻, 忌神, 克用神, 用神体系, 旺衰]
    confidence: 0.9
    attributes: { role: 忌神, controls: 用神 }

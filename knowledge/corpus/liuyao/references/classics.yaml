  - reference_id: ref:classic:liuyao_yongshen
    target_type: node
    target_id: kn:yong_shen:liuyao_yongshen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 用神章第八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "父母爻：占父母卽以卦中之父母爻爲神。……官鬼爻：占功名、官府、雷霆鬼神、妻占夫皆以官鬼爻爲用神。……兄弟爻：占兄弟、姐妹、族中兄弟、姑姨、妹夫及結拜兄弟都以兄弟爻爲用神。……妻財爻：占妻妾、婢、僕、役，我驅使之人皆以要財爻爲用神。……子孫爻：占子孫、占女、女婿、侄、甥、門生凡在我子孫輩中皆以子孫爻爲用神。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_yuanshen
    target_type: node
    target_id: kn:xi_shen:liuyao_yuanshen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 用神元神忌神仇神章第九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "用神，卽前各類之用神也。元神，生用神之神卽爲元神。忌神克用神之爻也。仇神者克元神而生忌神也。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_yuanshen_wangshuai
    target_type: node
    target_id: kn:xi_shen:liuyao_yuanshen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 元神忌神衰旺章第十, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "元神𨿽生用神，須要旺相，方可生得用神。……元神能生用神者有五：元神旺相或臨日月或日月動爻生扶者一也。元神動化回頭生及化進神者二也。元神長生帝旺於日辰三也。元神與忌神同動四也。元神旺動臨空化空五也。……元神𨿽現又有不能生用神者有六：元神休囚，不動或動而休囚又被傷克者一也。元神休囚又逢自空、月破二也。元神休囚動化退神三也。元神衰而又絕四也。元神入三墓五也。元神休囚動而化絕、化克、化破、化散六也。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_jishen
    target_type: node
    target_id: kn:ji_shen:liuyao_jishen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 元神忌神衰旺章第十, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "忌神動而克害用神者有五：忌神旺相或遇日月動爻生扶或臨日月者一也。忌神動化回頭生扶退神者二也。忌神旺動動臨空化空三也。忌神長生帝旺與日辰四也。忌神與仇神同動五也。……忌神𨿽動，不能克用神者有七：忌神休囚不動，而動休囚被日、月動爻克者一也。忌神靜臨空破二也。忌神入三墓三也。忌神衰動化退神四也。忌神衰而又絕五也。忌神動化絕化破、化克、化散六也。忌神與元神同動七也。"
    credibility: 0.9


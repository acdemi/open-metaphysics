  - reference_id: ref:classic:liuyao_yuejian
    target_type: node
    target_id: kn:pattern:liuyao_yuejian
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 月將章第十六, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "月將卽是月建又爲月令。掌一月之權，司三旬之令。……能助卦爻之衰弱，能挫爻象之旺彊……月建合爻爲月合，乃有用之爻也。月建沖爻卽爲月破，乃無用之爻也。……卦無用神卽以月建爲用神，不必尋伏神也。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_richen
    target_type: node
    target_id: kn:pattern:liuyao_richen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 日辰章第十七, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "日辰爲六爻之主宰，司四時之旺相。……沖旺相之靜爻，旣爲暗動，沖衰弱之靜爻爲日破……沖空卽起，沖合卽開……爻遇旬空，日辰沖起而有用，謂之沖空則實。逢合住遇日建以沖開，謂之沖合則散。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_liushen
    target_type: node
    target_id: kn:shen_sha:liuyao_liushen
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 六神章第十八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "諸書無不以靑龍爲吉，白虎爲凶。……此皆不以五行，竟以六神而斷生死。惟千金賦曰：虎興而遇吉神不害其吉，龍動而逢凶曜難掩其凶。此正理也，然則六神而不驗耶乎，乃附合之神也，卦之吉者逢龍而更吉，卦之凶者逢白虎而更凶，且元武主盜賊，朱雀主口舌，無不驗也"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_liuhe
    target_type: node
    target_id: kn:pattern:liuyao_liuhe_gua
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 六合章第十九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "子與丑合、寅與亥合、卯與戌合、辰與酉合、巳與申合，午與未合。相合法有六：日月合爻者一也。爻與爻合者二也。爻動化合者三也，卦逢六合四也。六沖卦變六合卦五也。六合卦變六合卦六也。……爻之合者，靜而逢合，謂之合起。動而逢合，合謂之合絆。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_sanhe
    target_type: node
    target_id: kn:pattern:liuyao_sanhe_ju
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 六合章第十九, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "申子辰合成水局、巳酉丑合成金局、寅午戌合成火局、亥卯未合成木局。此三合者有四。一卦之內有一爻動而合局者一也。若兩爻動一爻不動亦成合局者二也。有內卦初爻、三爻、動而變出爻成三合者三也。又有外四爻、六爻動、動而變出之爻成三合者四也。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_liuchong
    target_type: node
    target_id: kn:pattern:liuyao_liuchong_gua
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 六沖章第二十, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "子午相沖、丑未相沖、寅申相沖、卯酉相沖、辰戌相沖、巳亥相沖。……相沖之法有六。日月沖爻者一也，卦逢六沖二也，六合卦變六沖三也，沖變六沖四也。動爻變沖五也、爻與爻沖六也。……沖者散也，凡占凶事宜於沖散、占吉事而不宜，必兼用神而言，用神旺𨿽沖不破，用神失陷凶而又凶"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_sanxing
    target_type: node
    target_id: kn:pattern:liuyao_sanxing
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 三刑章第二十一, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "寅刑巳、巳刑申、子刑卯、卯刑午、丑戌相刑、未辰相刑。又云：辰午酉亥謂之自刑，夫三刑者，予屢試之，或因用神休囚又兼他爻犯之，刑者則見凶，而獨犯三刑得驗者少，占過數十年只驗得一卦。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_xunkong
    target_type: node
    target_id: kn:pattern:liuyao_xunkong
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 旬空章第二十六, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "何謂旬空？如甲子至癸酉日爲一旬，此十日之內，並無戌亥，以爻逢戌亥爲空亡，又名旬空，餘仿此。……野鶴曰：旺不爲空，動不爲空，有日建動爻生扶者不爲空……月破爲空。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_bengua
    target_type: node
    target_id: kn:pattern:liuyao_bengua

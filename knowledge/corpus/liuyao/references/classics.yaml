  - reference_id: ref:classic:liuyao_dongbian
    target_type: node
    target_id: kn:pattern:liuyao_dongyao
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 動變章第七, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "六爻不動則不變，動則必變……所以申金變出午火，子水變出戌土，申爻不動則不變。變出之爻安六親者仍照正卦而推，餘卦仿此。"

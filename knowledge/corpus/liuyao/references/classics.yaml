  - reference_id: ref:classic:liuyao_bagong
    target_type: node
    target_id: kn:palace:liuyao_bagong
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 卦象圖第二, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "乾宮八卦：﹝俱屬金﹞

乾爲天，天風姤，天山遁，天地否，風地觀，山地剝，火地晉，火天大有。

坎宮八卦：﹝俱屬水﹞

坎爲水，水澤節，水雷屯，水火旣濟，澤火革，雷火豐，地火明夷，地水師。

艮宮八卦：﹝屬土﹞

艮爲山，山火賁，山天大畜，山澤損，火澤睽，天澤履，風澤中孚，風山漸。

震宮八卦：﹝屬木﹞

震爲雷，雷地豫，雷水解，雷風恆，地風升，水風井，澤風大過，澤雷隨。

巽宮八卦：﹝屬木﹞

巽爲風，風天小畜，風火家人，風雷益，天雷無妄，火雷噬嗑，山雷頤，山風蠱。

離宮八卦：﹝屬火﹞

離爲火，火山旅，火風鼎，火水未濟，山水蒙，風水渙，天水訟，天火同人。

坤宮八卦：﹝屬土﹞

坤爲地，地雷復，地澤臨，地天泰，雷天大壯，澤天夬，水天需，水地比。

兌宮八卦：﹝屬金﹞

兌爲澤，澤水困，澤地萃，澤山咸，水山蹇，地山謙，雷山小過，雷澤歸妹。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_bagong_tu
    target_type: node
    target_id: kn:palace:liuyao_bagong
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 八宮圖第三, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "先學點卦，點出卦象看是何卦，卽出全圖內尋出此卦，照樣裝排「世」「應」「五行」「六親」，不用念卦書……六沖卦者，乾爲天、坎爲水、艮爲山、震爲雷、巽爲風、離爲火、坤爲地、兌爲澤，此八宮第一卦皆是六沖卦，再者天雷無妄、雷天大壯也是六沖卦一共十卦，其餘不是。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_najia
    target_type: node
    target_id: kn:pattern:liuyao_najia
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 渾天甲子章第四, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "乾在內：子水寅木辰土。乾在外：午火申金戌土。
* 坎在內：寅木辰土午火。坎在外：申金戌土子水。
* 辰在內：辰土午火申金。辰在外：戌土子水寅木。
* 震在內：子水寅木辰土。震在外；午火申金戌土。
* 巽在內：丑土亥水酉金。巽在外：未土巳火卯木。
* 離在內：卯木丑土亥水。離在外：酉金未土巳火。
* 坤在內：未土巳火卯木。坤在外：丑土亥水酉金。
* 兌在內：巳火卯木丑土。兌在外：亥水酉金未土。……點卦由下而上，故裝五行也由下而上，餘仿此。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_liuqin
    target_type: node
    target_id: kn:ten_god:liuyao_liuqin
    ref_type: classic_text
    source: { text: 增刪卜易, chapter: 六親歌章第五, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    passage: "乾兌宮金兄、土父、木財、火鬼、水子。乾兌宮八卦都屬金。
* 坎宮水兄、火財、土鬼、金父、木子。坎宮八卦都屬水。
* 坤艮宮土兄、火父、木鬼、水財、金子。坤艮宮八卦都屬土。
* 離宮火兄、水鬼、土子、木父，金財。離宮八卦都屬火。
* 震巽木兄、水父、金鬼、火子、土財。震巽宮八卦都屬木。"
    credibility: 0.9

  - reference_id: ref:classic:liuyao_shiying
    target_type: node
    target_id: kn:pattern:liuyao_shiying

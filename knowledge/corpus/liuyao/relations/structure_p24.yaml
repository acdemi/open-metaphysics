relations:
  - id: rel:liuyao_duiying:yuejian_yuepo
    source_node_id: kn:pattern:liuyao_yuejian
    target_node_id: kn:pattern:liuyao_yuepo
    relation_type: duiying
    direction: directed
    weight: 1.0
    evidence:
      - description: "月建冲爻为月破：正月申、二月酉，逐月值冲之支即是月破。"
        source: { text: 增刪卜易, chapter: 月破章第二十七, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
        weight: 1.0
    source: { text: 增刪卜易, chapter: 月破章第二十七, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    conditions:
      - { field: relation_subtype, value: yuejian_chong }


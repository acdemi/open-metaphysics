# KnowledgeRelation — 对应（duiying, Liuyao Corpus, 15 条 = 11 duiying + 2 sheng + 2 ke）
# P2.3 Liuyao Knowledge Integration: 结构概念之间的对应与用神体系的生克链。
#   用神/元神/忌神/仇神的生克方向以「生用神者元神、克用神者忌神、
#   克元神而生忌神者仇神」为准（/9）。
# 规范: KR-001~003 / reference/knowledge.py::KnowledgeRelation
# 证据: 增刪卜易/4 渾天甲子 / /5 六親歌 / /6 世應 / /7 動變 / /8 用神 /
#   /9 用神元神忌神仇神 / /16 月將 / /17 日辰 / /19 六合 / /20 六沖 / /26 旬空
#   （revision-pinned, 逐字核验）。

relations:
  - id: rel:liuyao_duiying:yongshen_liuqin
    source_node_id: kn:yong_shen:liuyao_yongshen
    target_node_id: kn:ten_god:liuyao_liuqin
    relation_type: duiying
    direction: directed
    weight: 1.0
    evidence:
      - description: "用神按所测之事取六亲：占父母以父母爻为用神，占功名以官鬼爻为用神，占财以妻财爻为用神。"
        source: { text: 增刪卜易, chapter: 用神章第八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
        weight: 1.0
    source: { text: 增刪卜易, chapter: 用神章第八, author: 野鶴老人, url: "https://zh.wikisource.org/wiki/增刪卜易", credibility: 0.9 }
    conditions:
      - { field: relation_subtype, value: yongshen_selection }


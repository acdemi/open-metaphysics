    interpretation: 厄者遭乎难者也，常居马前一辰、劫后二辰，死而不生谓之厄——申子辰水局水死在卯、寅午戌火局火死在酉、亥卯未木局木死在午、巳酉丑金局金死在子，所以为厄。若有救护扶持、逢生旺兼贵气相助则吉，究竟一生蹇滞；《壶中子》云「六厄为剥官之煞」。

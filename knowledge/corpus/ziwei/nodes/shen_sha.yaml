    interpretation: 勾者牵连之义，绞者羁绊之名，二煞尝相对冲，亦犹亡劫。阳男阴女命前三辰为勾、命后三辰为绞，阴男阳女反之（如甲子阳命人卯为勾、酉为绞；乙丑阴命人辰为绞、戌为勾）。此煞大忌金神白虎并则凶；身若克煞多心路计巧、主掌刑法之任或为将帅，煞若克身主非命而终，小人逢之非横灾祸，行年至此亦主口舌刑狱。

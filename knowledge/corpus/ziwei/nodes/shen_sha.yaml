    source: { text: 三命通会, chapter: 卷三·论天罗地网, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    interpretation: 戌亥为天罗（六阴之终），辰巳为地网（六阳之终）；阴阳终极则暗昧不明，如人之在罗网。《壶中子》云「龙蛇混杂，偏不利于辰生；猪犬侵凌，但独嫌于亥字」——辰人得巳、巳人得辰皆曰龙蛇混杂（男命不妨，惟女命破婚害子、薄命抱疾），戌人得亥、亥人得戌皆曰猪犬侵凌（女命不妨，惟男命妨祖克妻）。故男怕天罗、女怕地网；火命人有天罗，水土命人有地网，金木二命无之；重犯则灾不能歇。
    tags: [神煞, 子平, 凶煞]
    confidence: 0.8

  - id: kn:shen_sha:kong_wang
    node_type: shen_sha
    name_cn: 空亡
    name_en: kong_wang
    systems: [bazi]
    source: { text: 三命通会, chapter: 卷三·论空亡, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    interpretation: 空对实、亡对有言。以甲旬尽处曰空亡——有是位而无禄曰空，有支而无干曰亡；如甲子旬遁至酉而十干足，故无戌亥，余五旬例见。空而有实、亡而有存，未可便为凶论；禄入空亡须分前后之辰以表阴阳轻重。带此煞生旺则气度宽大、动招虚名，死绝则一生成败飘泊；与劫煞并则狡勇、与亡神并则飘蓬、与咸池六害并多凶暴卒，惟夹贵、华盖、三奇、学堂并者大聪明脱俗。经云「金空则响，火空则明，水空则清，木空则折，土空则崩」。
    tags: [神煞, 子平, 空]
    confidence: 0.85
    attributes: { 义理: "甲旬尽处；有是位而无禄曰空，有支而无干曰亡", 别称: 天中, 轻重: "甲子至戊辰以戌为空亡（见壬戌重、戊戌轻）；己巳至癸酉以亥为空亡（见癸亥重、乙亥轻）", 变体: "截路空亡/四大空亡/五鬼空亡/克害空亡/破祖空亡", section: 卷三·论空亡, 原文关键句: "故以甲旬尽处曰空亡，盖有是位而无禄，曰空；有支而无干，曰亡" }
  - id: kn:shen_sha:yuan_chen
    node_type: shen_sha
    name_cn: 元辰
    name_en: yuan_chen
    systems: [bazi]
    source: { text: 三命通会, chapter: 卷三·论元辰, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    interpretation: 元辰者别而不合之名：阳前阴后则有所屈，阴前阳后则直而不遂，故谓之元辰。阳男阴女在冲前一位支辰，阴男阳女在冲后一位支辰；如甲子生男与甲午对冲，即乙未为正。岁运临之如物当风、动摇颠倒，纵富贵崇高十年可畏；与官符并多招无辜之挠，带劫煞则不循细行、动招危辱。
    tags: [神煞, 子平, 凶煞]
    confidence: 0.8
    schools:
      - { school: ziping, interpretation: 徐子平以元辰为「命中元有所害之辰」（如甲见申庚、乙见酉辛之类）；岁运复遇谓之犯元辰，为害尤重，元无则轻，其煞与亡神、劫煞、羊刃、空亡同类观。, source: { text: 三命通会, chapter: 卷三·论元辰（引徐子平语）, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.75 }, weight: 0.7 }
    attributes: { 起例: "阳男阴女→冲前一位支辰；阴男阳女→冲后一位支辰", 示例: "甲子生男→乙未；乙丑生男→甲午", 并用: "与官符并、带劫煞", 评注: "原文谓常术《鼠忌羊头歌》不分男女，不足凭；又引林开「元辰恶煞为灾甚重」与徐子平说并存", section: 卷三·论元辰, 原文关键句: "阳男阴女，在冲前一位支辰；阴男阳女，在冲后一位支辰" }
  - id: kn:shen_sha:zai_sha
    node_type: shen_sha
    name_cn: 灾煞
    name_en: zai_sha

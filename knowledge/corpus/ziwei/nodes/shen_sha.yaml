  - id: kn:shen_sha:shi_e_da_bai
    node_type: shen_sha
    name_cn: 十恶大败
    name_en: shi_e_da_bai
    systems: [bazi]
    source: { text: 三命通会, chapter: 卷三·论十恶大败, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    interpretation: 十恶者譬律法中人犯十恶重罪在所不赦，大败者譬兵法中与敌交战大败无一生还，喻极凶也。六甲旬中十个日值禄入空亡——如甲辰、乙巳（甲以寅为禄、乙以卯为禄，甲辰旬以寅卯为空亡），又如壬申（壬以亥为禄，甲子旬以亥为空亡），余如丙申、丁亥、庚辰、戊戌、癸亥、辛巳、乙丑等日皆仿此。命中犯者当以日上见之为是，其余不论；犯者未必皆凶，内有吉神相扶、贵气相辅则当为吉论。
    tags: [神煞, 子平, 凶煞]
    confidence: 0.8
    attributes: { 例日: "甲辰/乙巳/壬申/丙申/丁亥/庚辰/戊戌/癸亥/辛巳/乙丑", 判法: "以日上见之为是；有吉神贵气相辅则作吉论", section: 卷三·论十恶大败, 原文异文: "「日值禄人空亡」中「禄人」疑为「禄入」之讹，登记为 V-7，保留原文", 原文关键句: "六甲旬中十个日值禄人空亡" }


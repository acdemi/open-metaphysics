    interpretation: 灾煞者其性勇猛，常居劫煞之前，冲破将星，谓之灾煞——申子辰将星在子而午冲、寅午戌在午而子冲、巳酉丑在酉而卯冲、亥卯未在卯而酉冲。主血光横死：在水火防焚溺，金木杖刃，土坠落，瘟疫克身，大凶；若有福神相助多是武权，要见官星、印绶生旺处为佳。
    tags: [神煞, 子平, 凶煞]
    confidence: 0.85
    attributes: { 起例: "四局将星之冲（申子辰→午；寅午戌→子；巳酉丑→卯；亥卯未→酉）", section: 卷三·论灾煞, 原文关键句: "常居劫煞之前，冲破将星，谓之灾煞" }

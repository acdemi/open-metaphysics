    source: { text: 三命通会, chapter: 卷三·论学堂词馆, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "临官乃词馆正位，如金命壬申，金临官在申；壬申，纳音又属金是也。余以类推。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_dexiu
    target_type: node
    target_id: kn:shen_sha:de_xiu
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论德秀, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "夫德者，本月生旺之德；秀者，合天地中和之气、五行变化而成者也。又曰；德者，阴阳解凶之神；秀者，天地清秀之气，四时当旺之神。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_anjindesha
    target_type: node
    target_id: kn:shen_sha:an_jin_de_sha
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论暗金的煞, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "此一煞而有三名；一曰吟呻，二曰破碎，三曰白衣。子午卯酉在巳，寅申巳亥在酉，辰戌丑未在丑。巳者，金生之地，巳中，临官之火，金气临克，主杖楚刑狱呻吟之灾，故曰吟呻。酉者，金旺之地，煞物当时，又有辛金相助，万物当之，无不破碎，主支离流血之灾，故曰破碎。丑乃金之库墓，居四季而临鬼门，主妨害丧服哭泣之事，故曰白衣。五行中惟金能煞物，故总名曰暗金的煞也。"
    credibility: 0.8

    target_type: node
    target_id: kn:shen_sha:san_qi
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论三奇, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "《珞琭子》曰：“奇为贵也；奇者，异也。”谓物以贵为奇也。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_tiande
    target_type: node
    target_id: kn:shen_sha:tian_de
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论天月德, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "夫德者，利物济人、掩凶作善之谓也。天德者，谓周天有三百六十五度二十五分半，除十二宫分野，每宫各占三十度，共计三百六十度，外有五度二十五分半，散在十二佐宫甲、庚、丙、壬、乙、辛、丁、癸、乾、坤、艮、巽，谓之神藏煞没。每宫各得四十四分，所以子午卯酉中有甲庚丙壬，辰戌丑未中有乙辛丁癸，寅申巳亥中有乾坤艮巽，此十二位宫，能回凶作善，乃曰天德也。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_yuede
    target_type: node
    target_id: kn:shen_sha:yue_de
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论天月德, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "月德者，乃三合所照之方，日月会合之辰，申子辰会酉出，庚入垣于壬；亥卯未会干出，丙入垣于甲；寅午戌会卯出，甲入垣于丙；巳酉丑会子出，壬入垣于庚，故壬甲丙癸谓之月德，而辰未戌丑四月，天德亦同属焉。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_taijigui
    target_type: node
    target_id: kn:shen_sha:tai_ji_gui_ren
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论太极贵, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "太极者，太初也，始也，物造于初为太极，成也，收也，物有所归曰极。造化始终相保，乃曰太极贵也。"
    credibility: 0.8
  - reference_id: ref:classic:sanming_xuetang
    target_type: node
    target_id: kn:shen_sha:xue_tang
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论学堂词馆, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "夫学堂者，如人读书之在学堂；词馆者，如今官翰林，谓之词馆，取其学业精专，文章出类。长生乃学堂之正位，如金命见辛巳，金长生在巳；辛巳，纳音又属金是也。"
    credibility: 0.8

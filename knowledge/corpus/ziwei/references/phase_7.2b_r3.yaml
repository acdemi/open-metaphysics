references:
  - reference_id: ref:classic:sanming_jinyu
    target_type: node
    target_id: kn:shen_sha:jin_yu
    ref_type: classic_text
    source: { text: 三命通会, chapter: 卷三·论金舆, author: "万民英", url: "https://zh.wikisource.org/wiki/三命通會/卷三", credibility: 0.8 }
    passage: "舆者，车也，金者，贵之义也，譬之君子居官得禄，须坐车以载之。故金舆常居禄前二辰，如甲子人禄在寅，辰为金舆是也。此煞乃禄命之旄旗，三才之节钺，主人性柔貌愿，举止温克，妇人逢之，不富即贵；男子得之，多妻妾，阴福相扶持，生日、生时遇之为佳，骨肉平生安泰，得贤妻妾，子孙茂盛。"
    credibility: 0.8

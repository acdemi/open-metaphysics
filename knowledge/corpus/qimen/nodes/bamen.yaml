    interpretation: 奇门八门，地盘所配为坎休、艮生、震伤、巽杜、离景、坤死、兑惊、乾开；中宫不开门。八门为「值使」体系：旬首所临地盘宫之门即为值使，值使随时支按阳遁顺行、阴遁逆行布于八宫（跳过中宫）。八门有吉凶与五行，并最怕迫制（门与宫相克）。八门只布八宫，与九星、八神同。
    tags: [奇门, 八门, 门, 值使体系]
    confidence: 0.85

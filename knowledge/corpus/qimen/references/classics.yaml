references:
  - reference_id: ref:classic:qimen_jiugong
    target_type: node
    target_id: kn:palace:qimen_jiugong
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之一·遁甲起例, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：洛书九宫为奇门之祖，戴九履一，左三右七，二四为肩，六八为足，五居中宫；上法九宫、下应九州，中建八门。九宫为地盘，六仪三奇按阴阳遁顺逆布之，中宫寄坤二宫。（读自维基文库转录本，非逐字核验；与 engine PALACE_NAMES_9 / PALACE_BRANCHES 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bamen
    target_type: node
    target_id: kn:shen_sha:qimen_bamen
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八门, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：八门地盘配属为坎休、艮生、震伤、巽杜、离景、坤死、兑惊、乾开；八门常为值使，随值符亦十时一易。论八门执事歌：欲求财利往生方，葬猎须知死路强；征战远行开门吉，休门见贵最为良；捉贼惊门无不获，杜门无事好逃藏；索债须防伤上去，思量饮酒景门高。（短句读自转录本，非逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bamen_suozhu
    target_type: relation
    target_id: rel:qimen_shuyu:bamen_kai
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八门所主, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：八门各有宜忌——开门宜征讨、谋望、入官见贵、应举、远行、嫁娶、移徙、商贾、营建，不宜治政；休门宜面君谒贵、上官到任、嫁娶、移徙，不宜行刑断狱；生门宜征讨谋望，不宜埋葬治丧；伤门宜渔猎讨捕索债；杜门宜捕盗剪凶；景门宜上书献策、招贤谒贵；死门宜决断刑狱吊丧埋葬；惊门宜掩捕盗贼。八门最怕迫制。（摘录改写，非逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_jiuxing
    target_type: node
    target_id: kn:main_star:qimen_jiuxing
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之一·九星值符图, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：九星地盘配属为坎一天蓬、坤二天芮、震三天冲、巽四天辅、中五天禽、乾六天心、兑七天柱、艮八天任、离九天英。九星常为值符用，十时一易，每用加时干。天禽阳遁阴遁俱寄坤宫。（读自转录本，非逐字核验；与 engine NINE_STARS 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_jiuxing_suozhu
    target_type: relation
    target_id: rel:qimen_shuyu:jiuxing_tianfu
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·九星所主, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：九星各有宜忌，天辅、天禽、天心、天任、天冲为吉，天蓬、天芮、天柱、天英为凶（「天辅冲任禽心吉，天蓬天英芮柱凶」）。天蓬宜安抚边境、修筑城池；天辅宜修道设教、诛凶伐暴；天心宜兴师陈旅、诛暴伐恶；天芮宜崇尚道德、尊师亲友；天柱宜修筑营垒、训练士卒；天任宜立国邑、化人民；天英宜远行献书。九星旺于子月。（摘录改写，非逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bashen
    target_type: node
    target_id: kn:shen_sha:qimen_bashen
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八神, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：八神次第为一值符、二腾蛇、三太阴、四六合、五勾陈、六朱雀、七九地、八九天（阳遁）；阴遁则次第逆行，并注「朱雀下有玄武，勾陈下又白虎」。本 engine 采用通行八神命名（以白虎、玄武代勾陈、朱雀），语料按 engine 用名收录并在 attributes 保留异名。（读自转录本，非逐字核验；流派差异已显式登记。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bashen_leishen
    target_type: node
    target_id: kn:shen_sha:qimen_shen_zhifu
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八神类神, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：八神类神——值符禀中央之土，为贵人之位，能育万物；腾蛇禀南方之火，为虚耗之神；太阴禀西方之金，为阴佑之神；六合禀东方之木，为护卫之神；勾陈（下有白虎）禀西方之金，为刚勇之神，主兵戈战斗；朱雀（下有玄武）禀北方之水，为刑戮奸谗之神；九地为坤土之象，万物之母；九天为乾金之象，万物之父。（摘录改写，非逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_yangdun
    target_type: node
    target_id: kn:pattern:qimen_yangdun
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·阳遁起例, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：阳遁九局顺布六仪、逆布三奇。一局甲子戊起坎一宫，甲戌己在坤二宫，甲申庚在震三宫，甲午辛在巽四宫，甲辰壬在中五宫，甲寅癸在乾六宫；丁在兑七宫，丙在艮八宫，乙在离九宫。二局甲子戊起坤二宫，余仿此。（读自转录本，非逐字核验；与 engine earth_placement(dun_type="yang") 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_yindun

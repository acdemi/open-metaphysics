    passage: 摘要：阴遁九局逆布六仪、顺布三奇。一局甲子戊起离九宫，甲戌己在艮八宫，甲申庚在兑七宫，甲午辛在乾六宫，甲辰壬在中五宫，甲寅癸在巽四宫；丁在震三宫，丙在坤二宫，乙在坎一宫。八局甲子戊起艮八宫，余仿此。（读自转录本，非逐字核验；与 engine earth_placement(dun_type="yin") 一致。）

  - reference_id: ref:classic:qimen_yangdun
    target_type: node
    target_id: kn:pattern:qimen_yangdun
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·阳遁起例, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 阳遁：阳遁九局，顺布六仪逆布三奇。如一局，甲子戊起坎一宫，则甲戌己在坤二宫，甲申庚在震三宫，甲午辛在巽四宫，甲辰壬在中五宫，甲寅癸在乾六宫，此顺布六仪也。丁在兑七宫，丙在艮八宫，乙在离九宫，此逆布三奇也。（逐字核验；与 engine earth_placement(dun_type="yang") 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_yindun
    target_type: node
    target_id: kn:pattern:qimen_yindun
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·阴遁起例, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 阴遁：阴遁九局逆布六仪顺布三奇。如甲子戊起离九宫，则甲戌己在艮八宫，甲申庚在兑七宫，甲午辛在乾六宫，甲辰壬在中五宫，甲寅癸在巽四宫，此逆布六仪也。（逐字核验；与 engine earth_placement(dun_type="yin") 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_yanbo_yinyang
    target_type: node
    target_id: kn:pattern:qimen_yangdun
    ref_type: classic_text
    source: { text: 烟波钓叟歌, author: 赵普（旧题）, url: "https://zh.wikisource.org/wiki/煙波釣叟歌", credibility: 0.7 }
    passage: 陰陽二遁分順逆，一氣三元人莫測。五日都來接一元，接氣超神為準則。認取九宮為九星，八門又逐九宮行。（逐字核验；转录本繁体原字，异文校注不引用。）
    credibility: 0.7

  - reference_id: ref:classic:qimen_zhifu
    target_type: node
    target_id: kn:pattern:qimen_zhifu
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·以旬首取符使法, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：旬首者，从用时之干溯至本旬之甲首；地盘旬首所临之宫，其星即为值符，其门即为值使。如旬首在坎宫，则天蓬星为值符，休门为值使。值符加时干法：看用时之干临于地盘何宫，即以天盘值符加于此宫，所谓伏吟者是也。（读自转录本，非逐字核验；与 engine 值符/天盘顺转一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_zhishi
    target_type: node
    target_id: kn:pattern:qimen_zhishi
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·值使加时支法, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：八门常为值使，随值符亦十时一易；值使加时支——看用时之支临于地盘何宫，即以天盘值使加于其上，阳遁顺行、阴遁逆行。值符值使诀：一逢坎上一坎休，芮死还排第二流，更有冲伤居震位，巽逢杜辅数为头。（短句读自转录本，非逐字核验；与 engine 值使落宫一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_liuyi
    target_type: node
    target_id: kn:pattern:qimen_liuyi
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·六仪遁, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 六仪：戊己庚辛壬癸为六仪。甲子遁于六戊，甲戌遁于六己，甲申遁于六庚，甲午遁于六辛，甲辰遁于六壬，甲寅遁于六癸。（逐字核验；与 engine LIUYI / LIUJIA 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_sanqi
    target_type: node
    target_id: kn:pattern:qimen_sanqi
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·三奇喜怒, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：三奇为乙丙丁，乙为日奇、丙为月奇、丁为星奇，三奇之中星奇最灵。遁甲起例述「逆飞三奇（乙为日奇，丙为月奇，丁为星奇）」。三奇喜怒详列三奇到各宫之名（如乙奇到震为玉兔游宫、丁奇到坎为朱雀投江）。（摘录改写，非逐字核验；与 engine SANQI 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_xunshou_kongwang
    target_type: node
    target_id: kn:pattern:qimen_kongwang
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之三·孤虚, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：《奇门遁甲统宗》卷之三论「孤虚」：年月日时俱以前一位空亡为孤，孤之冲为虚，并按年孤/月孤/旬孤/日孤/时孤分量取用。本语料所收录之「空亡」为六甲旬空（旬中二支）之通行义，engine 将时柱旬空二支映射为宫位；二者为同类而不同义的方位法，宜分别看待。（摘录改写，非逐字核验。）
    credibility: 0.8

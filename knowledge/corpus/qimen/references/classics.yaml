references:
  - reference_id: ref:classic:qimen_jiugong
    target_type: node
    target_id: kn:palace:qimen_jiugong
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之一·遁甲起例, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 戴九履一者，河洛之精蕴。配以八门，八神列矣；加以三盘，三才正矣；重以三奇，三光耀矣。（逐字核验；与 engine PALACE_NAMES_9 / PALACE_BRANCHES 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bamen
    target_type: node
    target_id: kn:shen_sha:qimen_bamen
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八门, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 坎休、艮生、震伤、巽杜、离景、坤死、兑惊、乾开。……论八门执事歌 欲求财利往生方，葬猎须知死路强。征战远行开门吉，休门见贵最为良。捉贼惊门无不获，杜门无事好逃藏。索债须防伤上去，思量饮酒景门高。（逐字核验；`……` 连接不连续原文段。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bamen_suozhu
    target_type: relation
    target_id: rel:qimen_shuyu:bamen_kai
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八门所主, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 开门所主：开门宜征讨、谋望、入官见贵、应举、远行、嫁娶、移徙、商贾、营建，不宜治政，有私人窥伺。休门所主：休门宜面君谒贵、上官到任、嫁娶、移徙、商贾、营建，诸事皆吉，不宜行刑断狱。生门所主：生门宜征讨、谋望、入官见贵、嫁娶、移徙，诸事皆吉，不宜埋葬治丧。伤门所主：伤门宜渔猎、讨捕索债、博戏、收敛货财，余俱不宜。杜门所主：杜门宜捕盗、剪凶、决隐、狱形、填塞沟壑，余俱不宜。（逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_jiuxing
    target_type: node
    target_id: kn:main_star:qimen_jiuxing
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之一·九星值符图, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 摘要：九星地盘配属为坎一天蓬、坤二天芮、震三天冲、巽四天辅、中五天禽、乾六天心、兑七天柱、艮八天任、离九天英。九星常为值符用，十时一易，每用加时干。天禽阳遁阴遁俱寄坤宫。（读自转录本，非逐字核验；与 engine NINE_STARS 一致。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_jiuxing_suozhu
    target_type: relation
    target_id: rel:qimen_shuyu:jiuxing_tianfu
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·九星所主, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 天辅冲任禽心吉，天蓬天英芮柱凶。凡时下得辅禽心大吉，任冲小吉，蓬芮大凶，英柱小凶。（逐字核验。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bashen
    target_type: node
    target_id: kn:shen_sha:qimen_bashen
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八神, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 八神：一值符、二腾蛇、三太阴、四六合、五勾陈、六朱雀、七九地、八九天，此谓阳遁也。阴遁则一值符、二九天、三九地、四朱雀、五勾陈、六六合、七太阴、八腾蛇（朱雀下有玄武，勾陈下又白虎）。（逐字核验；语料按 engine 用名收录并在 attributes 保留异名。）
    credibility: 0.8

  - reference_id: ref:classic:qimen_bashen_leishen
    target_type: node
    target_id: kn:shen_sha:qimen_shen_zhifu
    ref_type: classic_text
    source: { text: 奇门遁甲统宗, chapter: 卷之二·八神类神, author: 程道生（旧题）, url: "https://zh.wikisource.org/wiki/奇門遁甲統宗", credibility: 0.8 }
    passage: 值符：禀中央之土，为贵人之位，能育万物，大将利居其下。……腾蛇：禀南方之火，为虚耗之神。（逐字核验；`……` 连接不连续原文段。）

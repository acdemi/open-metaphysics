[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-metaphysics"
version = "0.1.0"
description = "Local-first, privacy-preserving multi-agent metaphysics reasoning framework with deterministic rule engines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenMetaphysics" }]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "langgraph>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
rag = ["qdrant-client>=1.10"]
persist = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openmetaphysics = "openmetaphysics.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501","UP017"]


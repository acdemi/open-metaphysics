# OpenMetaphysics -- Unified pre-commit hooks for Polyglot Monorepo
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- General file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # --- YAML ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]

  # --- Markdown ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [markdown]
        args: ["--prose-wrap=always", "--print-width=120"]

  # --- Knowledge corpus validation (H10) ---
  # Prevents a silent PASS: runs the same structural + source-registry +
  # frozen-corpus + registered-coverage gate as `python knowledge/validate.py`
  # (default mode; use --strict for the full-evidence gate).
  - repo: local
    hooks:
      - id: knowledge-validate
        name: knowledge validator (coverage report, no silent PASS)
        entry: python knowledge/validate.py
        language: system
        files: ^knowledge/
        pass_filenames: false

  # --- Python (ruff) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(src|tests|reference|scripts)/
      - id: ruff-format
        files: ^(src|tests|reference|scripts)/

  # --- Rust ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # --- Go ---
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd services/gateway && gofmt -l .'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: bash -c 'cd services/gateway && go vet ./...'
        language: system
        files: \.go$
        pass_filenames: false

  # --- Protobuf ---
  - repo: local
    hooks:
      - id: buf-lint
        name: buf lint
        entry: buf lint
        language: system
        files: \.proto$
        pass_filenames: false
